name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './tauri-host -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run code check and tests
        run: |
          npm run typecheck
          npm run test

      - name: Build frontend workbench
        run: npm run build

      - name: Build Tauri desktop host & installer
        run: npm run host:build

      - name: Package DevKit for customers
        run: npm run pack:devkit

      - name: Locate release assets
        id: assets
        shell: pwsh
        run: |
          $assets = @()

          # 1. 客户二次开发套件 ZIP
          if (Test-Path "release-artifacts/om-workbench-devkit.zip") {
            $assets += "release-artifacts/om-workbench-devkit.zip"
          }

          # 2. Tauri NSIS 安装包 (安装器)
          $nsisFiles = Get-ChildItem -Path "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if ($nsisFiles) {
            foreach ($f in $nsisFiles) {
              $assets += $f.FullName
            }
          }

          # 3. 单体便携运行器二进制 (可选免安装版)
          if (Test-Path "target/release/tauri-host.exe") {
            $assets += "target/release/tauri-host.exe"
          } elseif (Test-Path "target/release/OM Workbench.exe") {
            $assets += "target/release/OM Workbench.exe"
          }

          Write-Host "Found assets to release:"
          $assets | ForEach-Object { Write-Host " - $_" }

          $assetList = ($assets | ForEach-Object { "$_" }) -join "`n"
          Set-Content -Path $env:GITHUB_OUTPUT -Value "files<<EOF`n$assetList`nEOF" -Append

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: OM Workbench ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.assets.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
